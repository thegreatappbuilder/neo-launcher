name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descarcă codul
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cheia de semnare
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Semnare cu cheia ta."
          else
            echo "::warning::Lipsește secretul KEYSTORE_BASE64. APK-ul se semnează temporar și actualizările peste versiunea veche nu vor merge. Vezi GHID.md."
          fi

      - name: Construiește APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          FIREBASE_DB_URL: ${{ vars.FIREBASE_DB_URL }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew assembleGithubRelease bundlePlayRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/github/release/app-github-release.apk NeoLauncher.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab NeoLauncher-play.aab

      - name: Publică în Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NEO Launcher 1.0.${{ github.run_number }}
          body: |
            Descarcă **NeoLauncher.apk** de mai jos și instalează-l pe telefon.
            Cod versiune (pentru panoul de admin): **${{ github.run_number }}**

            `NeoLauncher-play.aab` este pachetul pentru Google Play Console.
          files: |
            NeoLauncher.apk
            NeoLauncher-play.aab
          make_latest: true
